<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Kubernetes Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0047ab, #00264d);
            color: white;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #ddd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            margin: 1rem 0;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to SIR's Kubernetes Demo</h1>
        <p>Exploring the Power of Cloud-Native Architecture</p>
        <div>
            <span class="badge">Kubernetes</span>
            <span class="badge">Docker</span>
            <span class="badge">Nginx</span>
            <span class="badge">Microservices</span>
        </div>
        <p>Running on a Kind Cluster with Ingress Routing</p>
    </div>
</body>
</html>
