# Flask Application Service
# Exposes the Flask application to the cluster and external traffic
# Type: LoadBalancer makes the service accessible externally
apiVersion: v1
kind: Service
metadata:
  name: llm-app-lb-service
  labels:
    app: llm-app
    component: web
    tier: backend
spec:
  selector:
    app: llm-app
  ports:
    - name: http
      protocol: TCP
      port: 80  # External port
      targetPort: http  # Maps to container port 5000
  type: LoadBalancer