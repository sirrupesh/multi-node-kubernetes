# Flask Counter Service
# External access to visitor tracking app
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  labels:
    my-app: flask-backend
    component: flask
    tier: backend
spec:
  selector:
    my-app: flask-backend
  ports:
    - name: flask-http      # App endpoint
      protocol: TCP
      port: 80             # Service port
      targetPort: flask-http  # Container port 5000
  type: LoadBalancer       # External access