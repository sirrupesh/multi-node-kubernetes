# Flask App Base Config
# Visitor counter service components
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml  # Runtime configuration
  - service.yaml     # Network exposure

labels:
  - includeSelectors: false
    pairs:
      component: web     # Service type
      tier: backend     # Architecture layer
      environment: base # Base config