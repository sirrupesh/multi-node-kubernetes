# Visit Counter App
# HA deployment with monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    my-app: flask-backend
    component: flask
    tier: backend
spec:
  replicas: 3  # HA setup
  selector:
    matchLabels:
      my-app: flask-backend
  template:
    metadata:
      labels:
        my-app: flask-backend
        component: flask
        tier: backend
    spec:
      containers:
      - name: flask-app
        image: sirrupesh/sample:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: flask-http  # App port
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api-key
        resources:
          requests:
            cpu: "100m"     # Base CPU
            memory: "128Mi" # Base RAM
          limits:
            cpu: "500m"     # CPU cap
            memory: "256Mi" # RAM cap
        livenessProbe:
          httpGet:
            path: /
            port: flask-http
          initialDelaySeconds: 10  # Startup delay
          periodSeconds: 30        # Check freq
        readinessProbe:
          httpGet:
            path: /
            port: flask-http
          initialDelaySeconds: 5   # Init delay
          periodSeconds: 10        # Check freq