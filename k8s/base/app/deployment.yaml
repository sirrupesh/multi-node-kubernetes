# Flask Visit Counter Deployment
# Highly available setup with monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    my-app: flask-backend
    component: flask
    tier: backend
spec:
  replicas: 3  # HA configuration
  selector:
    matchLabels:
      my-app: flask-backend
  template:
    metadata:
      labels:
        my-app: flask-backend
        component: flask
        tier: backend
    spec:
      containers:
      - name: flask-app
        image: sirrupesh/sample:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: flask-http
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api-key
        resources:
          requests:
            cpu: "100m"     # Minimum CPU
            memory: "128Mi" # Minimum RAM
          limits:
            cpu: "500m"     # Maximum CPU
            memory: "256Mi" # Maximum RAM
        livenessProbe:
          httpGet:
            path: /
            port: flask-http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: flask-http
          initialDelaySeconds: 5
          periodSeconds: 10