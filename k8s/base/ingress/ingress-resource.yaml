# External Access Configuration
# Routes traffic to internal services:
# - sirrupesh.localhost -> Flask counter
# - cambridge.localhost -> Nginx static content
# - app4.localhost -> PHP diagnostics

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /  # URL path rewrite
spec:
  ingressClassName: nginx
  rules:
  - host: "sirrupesh.localhost"  # Counter app
    http:
      paths:
      - path: /
        pathType: Prefix  # Matches all paths under root
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
  - host: "cambridge.localhost"  # Static content
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-frontend-service
            port:
              number: 80
  - host: "app4.localhost"  # System info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php-app-service
            port:
              number: 80