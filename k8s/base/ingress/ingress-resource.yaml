# Ingress Traffic Configuration
# Provides external access to cluster services through URL-based routing
# 
# Service Endpoints:
# - sirrupesh.localhost -> Flask visitor counter
# - cambridge.localhost -> Nginx static content
# - app4.localhost -> PHP diagnostics (internal use)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /  # Removes path prefix for clean URLs
spec:
  ingressClassName: nginx  # Uses the nginx ingress controller
  rules:
  - host: "sirrupesh.localhost"  # Primary application endpoint
    http:
      paths:
      - path: /
        pathType: Prefix  # Matches all paths under root
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
  - host: "cambridge.localhost"  # Static content endpoint
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-frontend-service
            port:
              number: 80
  - host: "app4.localhost"  # Diagnostic endpoint (restrict in production)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php-app-service
            port:
              number: 80