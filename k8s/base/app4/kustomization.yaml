# PHP Info Base Config
# Diagnostic service components
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml  # Runtime settings
  - service.yaml     # Network exposure

labels:
  - includeSelectors: false
    pairs:
      component: diagnostic  # Service type
      tier: backend         # Architecture layer
      environment: base     # Base config