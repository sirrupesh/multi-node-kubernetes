# PHP Application Deployment
# Deploys PHP environment information service with Apache web server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app-deployment
  labels:
    my-app: php-backend
    component: php
    tier: backend
spec:
  replicas: 2  # Multiple replicas for availability
  selector:
    matchLabels:
      my-app: php-backend
  template:
    metadata:
      labels:
        my-app: php-backend
        component: php
        tier: backend
    spec:
      containers:
      - name: php-app
        image: sirrupesh/myphp:latest
        imagePullPolicy: Never  # Use local image only
        ports:
        - containerPort: 80
          name: php-http  # Named port for service reference
        # Resource constraints
        resources:
          requests:
            cpu: "100m"     # CPU request
            memory: "128Mi" # Memory request
          limits:
            cpu: "500m"     # CPU limit
            memory: "256Mi" # Memory limit
        # Health monitoring
        livenessProbe:
          httpGet:
            path: /
            port: php-http
          initialDelaySeconds: 10  # Delay before first probe
          periodSeconds: 30        # How often to probe (frequency)
        readinessProbe:
          httpGet:
            path: /
            port: php-http
          initialDelaySeconds: 5   # Delay before first probe
          periodSeconds: 10        # How often to probe (frequency)