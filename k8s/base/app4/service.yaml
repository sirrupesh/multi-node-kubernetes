# PHP Info Backend
# Internal system diagnostics
apiVersion: v1
kind: Service
metadata:
  name: php-app-service
  labels:
    my-app: php-backend    # Service identifier
    component: php         # Tech stack
    tier: backend         # Architecture layer
spec:
  type: ClusterIP        # Internal only
  ports:
    - port: 80           # Service port
      targetPort: php-http  # App port
      protocol: TCP
      name: php-http    # Endpoint name
  selector:
    my-app: php-backend  # Pod selector