# Nginx Frontend Service
# Exposes static web content externally
apiVersion: v1
kind: Service
metadata:
  name: nginx-frontend-service
  labels:
    my-app: nginx-frontend
    component: nginx
    tier: frontend
spec:
  selector:
    my-app: nginx-frontend
  ports:
    - name: nginx-http      # Web traffic port
      protocol: TCP
      port: 80             # External port
      targetPort: nginx-http  # Container port
  type: LoadBalancer       # External access