# Nginx Web Server Deployment
# Serves static content with basic HTTP capabilities
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-frontend-deployment
  labels:
    my-app: nginx-frontend
    component: nginx
    tier: frontend
spec:
  replicas: 2  # High availability setup
  selector:
    matchLabels:
      my-app: nginx-frontend
  template:
    metadata:
      labels:
        my-app: nginx-frontend
        component: nginx
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
          name: nginx-http  # Named port for service binding
        # Resource allocation
        resources:
          requests:
            cpu: "100m"     # Base CPU needs
            memory: "64Mi"  # Base memory needs
          limits:
            cpu: "200m"     # CPU ceiling
            memory: "128Mi" # Memory ceiling
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: nginx-http
          initialDelaySeconds: 10  # Startup grace period
          periodSeconds: 30        # Check interval
        readinessProbe:
          httpGet:
            path: /
            port: nginx-http
          initialDelaySeconds: 5   # Initial wait
          periodSeconds: 10        # Check frequency