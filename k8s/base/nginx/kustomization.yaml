# Nginx Server Kustomization
# Manages Nginx deployment and service resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml  # Nginx server pods
  - service.yaml     # Service exposure

labels:
  - includeSelectors: false
    pairs:
      component: web
      tier: frontend
      environment: base