# Static Web Base Config
# Basic web server components
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml  # Server runtime
  - service.yaml     # HTTP exposure

labels:
  - includeSelectors: false
    pairs:
      component: static   # Service type
      tier: frontend     # Architecture layer
      environment: base  # Base config