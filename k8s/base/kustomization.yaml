# Core Infrastructure
# Main service composition for multi-app demo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app      # Visitor counter
  - app4     # PHP diagnostics
  - nginx    # Static content
  - ingress  # Traffic routing

namespace: sir-ns  # Dedicated namespace

labels:
  - includeSelectors: false
    pairs:
      managed-by: kustomize  # Tool identifier
      environment: base      # Config tier