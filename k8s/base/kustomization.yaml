# Core Services
# Multi-app demo composition:
# - Visit counter
# - PHP diagnostics
# - Static content
# - Traffic routing

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app      # Counter
  - app4     # Diagnostics
  - nginx    # Static
  - ingress  # Routing

namespace: sir-ns

labels:
  - includeSelectors: false
    pairs:
      managed-by: kustomize
      environment: base