# Kubernetes Dashboard Authentication Configuration
# WARNING: This grants full cluster admin access - use with caution
# Consider implementing more granular RBAC for production use

---
# Service Account Configuration
# Creates dedicated admin user for dashboard access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard

---
# RBAC Configuration
# Grants cluster-admin privileges to dashboard user
# WARNING: Provides unrestricted cluster access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin  # Grants full cluster management rights
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard

---
# Authentication Token
# Auto-generates a service account token for dashboard login
apiVersion: v1
kind: Secret
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: "admin-user"  # Links to service account
type: kubernetes.io/service-account-token  # Standard K8s token type