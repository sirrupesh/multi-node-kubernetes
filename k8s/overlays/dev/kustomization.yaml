# Development Environment Kustomization
# Customizes base configuration for development environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference to base configuration
resources:
  - ../../base

# Namespace for development environment
namespace: dev

# Common labels for all resources in dev
commonLabels:
  environment: development
  
# Patches to override base configuration
patches:
  # Reduce replica count for development
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Modify resource limits for development
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"