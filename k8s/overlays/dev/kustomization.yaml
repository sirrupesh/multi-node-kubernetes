# Development Environment
# - Minimal resources for local testing
# - Debug-friendly settings
# - Hot reload enabled

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dev

commonLabels:
  environment: development
  managed-by: kustomize

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
    - FLASK_ENV=development
    - FLASK_DEBUG=true
    - LOG_LEVEL=debug
    - ENABLE_METRICS=false

patches:
  # Dev Resources
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

  # Health Checks
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /health/live
            port: flask-http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /health/ready
            port: flask-http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1

  # Hot Reload Setup
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FLASK_DEBUG
          value: "1"
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: app-code
            mountPath: /app
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: app-code
            hostPath:
              path: /src/app
              type: Directory