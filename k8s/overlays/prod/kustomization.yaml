# Prod Config
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base  # Core

namespace: sir-prod  # Production namespace

labels:
  - includeSelectors: false
    pairs:
      environment: production
      tier: production

# Runtime
configMapGenerator:
- name: app-config
  literals:
    - LOG_LEVEL=info      # Default
    - ENABLE_METRICS=true # Stats

patches:
  # HA
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5  # Scale out

  # Resources
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"     # Min CPU
            memory: "512Mi" # Min RAM
          limits:
            cpu: "1000m"    # Cap CPU
            memory: "1Gi"   # Cap RAM

  # Auth
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true # Safe
          runAsUser: 1000    # App
          fsGroup: 2000      # Data

  # Metrics
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true" # Enable
          prometheus.io/port: "5000"   # Port