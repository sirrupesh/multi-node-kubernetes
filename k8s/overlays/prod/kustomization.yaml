# Production Environment Kustomization
# Customizes base configuration for production environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference to base configuration
resources:
  - ../../base

# Namespace for production environment
namespace: prod

# Labels for all resources in production
labels:
  - includeSelectors: false
    pairs:
      environment: production
      tier: production

# ConfigMap generator for production-specific configs
configMapGenerator:
- name: app-config
  literals:
    - LOG_LEVEL=info
    - ENABLE_METRICS=true

# Patches to override base configuration
patches:
  # Increase replica count for production
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  # Enhance resource limits for production
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
  # Add production security context
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000
  # Add production-specific pod annotations
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "5000"