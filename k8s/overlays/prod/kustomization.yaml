# Production Environment
# - High availability and scalability
# - Resource optimization
# - Security hardening
# - Monitoring integration

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: prod  # Production isolation

commonLabels:
  environment: production
  managed-by: kustomize
  tier: production
  compliance: pci-dss

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
    - LOG_LEVEL=info
    - ENABLE_METRICS=true
    - METRICS_PORT=9090
    - SESSION_SECURE=true
    - RATE_LIMIT=100
    - CORS_ORIGINS=*.example.com

patches:
  # High Availability
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0

  # Resource Limits
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

  # Security Context
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true

  # Health Probes
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /health/live
            port: flask-http
            httpHeaders:
            - name: Custom-Header
              value: health-check
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /health/ready
            port: flask-http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          successThreshold: 2

  # Monitoring
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9090"
          prometheus.io/path: "/metrics"
          checksum/config: ${CONFIGMAP_CHECKSUM}

  # Pod Distribution
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: my-app
                    operator: In
                    values:
                    - flask-backend
                topologyKey: "kubernetes.io/hostname"

  # Pod Disruption Budget for HA
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: flask-app-pdb
      spec:
        minAvailable: 3
        selector:
          matchLabels:
            my-app: flask-backend

  # Production Environment Variables
  - target:
      kind: Deployment
      name: flask-app-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_ENV
          value: "production"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENABLE_CACHE
          value: "true"