# Production Environment Configuration
# Provides high availability, resource limits, and security hardening
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base  # Import base configuration

namespace: prod  # Production namespace isolation

labels:
  - includeSelectors: false
    pairs:
      environment: production
      tier: production

# Runtime Configuration
configMapGenerator:
- name: app-config
  literals:
    - LOG_LEVEL=info      # Production logging level
    - ENABLE_METRICS=true # Enable prometheus metrics collection

patches:
  # High Availability Configuration
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5  # Multiple replicas for load distribution and failover

  # Production Resource Allocation
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"     # Guaranteed CPU allocation
            memory: "512Mi" # Guaranteed memory allocation
          limits:
            cpu: "1000m"    # Maximum CPU usage
            memory: "1Gi"   # Maximum memory usage

  # Security Context Configuration
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true # Prevent root execution
          runAsUser: 1000    # Dedicated service account
          fsGroup: 2000      # File system access group

  # Monitoring Configuration
  - target:
      kind: Deployment
      name: llm-app
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true" # Enable metrics collection
          prometheus.io/port: "5000"   # Metrics endpoint port